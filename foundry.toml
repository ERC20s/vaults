[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

# The conformance suite is written against plain require/try-catch and imports nothing
# outside this repository, so `forge test` runs with no submodule or install step.
[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000
