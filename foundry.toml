# Foundry project manifest for the ERC-4626 vault protocol.
# Docs: https://book.getfoundry.sh/reference/config/

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Matches `pragma solidity ^0.8.19;` in src/interfaces/IStrategy.sol.
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Warnings stay warnings for now; tighten once the Vault contract lands.
deny_warnings = false

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false
call_override = false

# CI profile: same layout, more fuzzing. Select with FOUNDRY_PROFILE=ci.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
